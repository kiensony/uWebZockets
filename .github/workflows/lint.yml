name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  fmt:
    name: Check Zig Formatting
    runs-on: ubuntu-24.04
    environment: Linting
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run Zig fmt
        run: zig fmt --check build.zig src examples tests

      - name: Check repository conventions
        run: sh scripts/check_conventions.sh
