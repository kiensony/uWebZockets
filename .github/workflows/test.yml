name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Checks & Tests
    runs-on: ubuntu-24.04
    environment: Testing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache Zig and C/C++ build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/zig
            .zig-cache/vendor-build
          key: ${{ runner.os }}-zig-v5-${{ hashFiles('build.zig', 'build.zig.zon', 'flake.nix', 'flake.lock', 'vendor/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-zig-v5-

      - name: Run debug tests
        run: nix develop "path:." -c zig build test --summary all

      - name: Run ASan and UBSan tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: nix develop "path:." -c zig build test -Dsanitize=true -Doptimize=ReleaseSafe --summary all

      - name: Compile ReleaseSafe tests
        run: nix develop "path:." -c zig build test-compile -Doptimize=ReleaseSafe --summary all

      - name: Fuzz bounded protocol parsers
        run: nix develop "path:." -c zig build fuzz --fuzz=100K -Doptimize=ReleaseSafe

      - name: Build ReleaseFast library
        run: nix develop "path:." -c zig build lib -Doptimize=ReleaseFast --summary all
